# Performance
repaint_delay                   6
input_delay                     1
sync_to_monitor                 no

# Font settings
# font_family                     Monaco Nerd Font
# bold_font                       auto
# italic_font                     auto
# bold_italic_font                auto
font_size                       18
disable_ligatures               never
# adjust_line_height              1

# Mouse
copy_on_select                  yes
strip_trailing_spaces           always

# Cursor
cursor_shape                    block
cursor_trail          3

# Window layout
window_border_width             1px
hide_window_decorations         yes

# Bell
enable_audio_bell               no
window_alert_on_bell            yes
bell_on_tab                     no

# Tab Bar
tab_bar_edge                    top
tab_bar_style                   powerline
tab_powerline_style             slanted
tab_bar_min_tabs                1
tab_bar_align                   left

# Advance
shell_integration               enabled no-cursor
update_check_interval           0

# Nord Colorscheme for Kitty
# Based on:
# - https://gist.github.com/marcusramberg/64010234c95a93d953e8c79fdaf94192
# - https://github.com/arcticicestudio/nord-hyper
# foreground              #e0def4
# background              #12121e
# selection_foreground    #12121e
# selection_background    #FFFACD
# url_color               #9ccfd8
# cursor                  #cccccc

# black
# color0   #3B4252
# color8   #4C566A

# red
# color1   #FF789E
# color9   #FF789E

# green
# color2   #A3BE8C
# color10  #A3BE8C

# yellow
# color3   #f6c177
# color11  #f6c177

# blue
# color4  #81A1C1
# color12 #81A1C1

# magenta
# color5   #c4a7e7
# color13  #c4a7e7

# cyan
# color6   #9ccfd8
# color14  #8FBCBB

# white
# color7   #E5E9F0
# color15  #ECEFF4

# Windows
# active_border_color     #f6c177
# inactive_border_color   #12121e

# Tabs
# active_tab_foreground   #12121e
# active_tab_background   #9ccfd8
active_tab_font_style   bold
# inactive_tab_foreground #e0def4
# inactive_tab_background #12121e
inactive_tab_font_style normal

background_opacity 0.5

# ####### Keyboard Shortcuts #######
#
# kitty_mod 重定义为 ctrl+alt 以避让 Zellij (占用 Alt=物理Win) 和 Hyprland (占用 SUPER=物理Alt)
# 原 Alt 组合全部迁移至 kitty_mod，避免与 Zellij 的 Alt+n/e/u/i/[/w/1-9 抢占
kitty_mod                ctrl+alt
#
# ## Misc
# # map alt+ctrl+shift+g launch --cwd=current gitui
#
# ## Tab management
# 原冲突: alt+1..9 与 Zellij/Hyprland 易混淆，已迁移至 kitty_mod
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
#
# ## Window management
# map alt+enter new_window_with_cwd
#
# map alt+v toggle_layout tall
# map alt+s toggle_layout grid
#
# 原冲突: alt+n/e/u/i 与 Zellij Alt+n/e/u/i (MoveFocus) 精确冲突 → 迁移
map kitty_mod+n neighboring_window left
map kitty_mod+e neighboring_window bottom
map kitty_mod+u neighboring_window top
map kitty_mod+i neighboring_window right
map kitty_mod+w  close_window
map kitty_mod+[ previous_tab
map kitty_mod+] next_tab
#
# map alt+shift+h move_window left
# map alt+shift+j move_window bottom
# map alt+shift+k move_window top
# map alt+shift+l move_window right
#
# # map alt+shift+1 move_window left
# # map alt+shift+2 move_window bottom
# # map alt+shift+3 move_window top
# # map alt+shift+4 move_window right
# # map alt+shift+5 move_window right
# # map alt+shift+6 move_window right
# # map alt+shift+7 move_window right
# # map alt+shift+8 move_window right
# # map alt+shift+9 move_window right
# map kitty_mod+f4 detach_window ask


# BEGIN_KITTY_THEME
# Gruvbox Material Dark Medium
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="Consolas Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
