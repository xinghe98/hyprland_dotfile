# Execute your favorite apps at launch
#exec-once = waybar & hyprpaper & firefox
# Waybar
exec-once = $HyprDir/bar/waybar/launch.sh
# Notifyd (exec-once 避免重载时重复启动)
exec-once = dunst -config ${HOME}/.config/hypr/notification/dunst/dunstrc
# Fcitx5 (exec-once 避免 dbus name 冲突)
exec-once = fcitx5 -d --replace
# mpd (若使用 systemd 则会静默失败，无害)
exec-once = mpd

exec-once = ${HOME}/.config/hypr/script/settheme
exec-once = keymapper

# Clipbord
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Allow run root applications
exec-once = xhost + local:
# 壁纸轮换 (使用 swww，每30分钟自动换一张壁纸)
# 需要先安装 swww: paru -S swww
exec-once = $HyprDir/script/wallpaper-rotate.sh --interval 6400

exec-once = /usr/lib/polkit-kde-authentication-agent-1
